<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zerodha & Coin Portfolio Intelligence Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

      theme: {

          colors: {
            brand: {

              500: '#00f2fe',
              600: '#4facfe',
            }
          }
        }
