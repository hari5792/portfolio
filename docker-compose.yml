version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PARSER_SERVICE_URL=http://parser-service:5001
      - ANALYTICS_SERVICE_URL=http://analytics-service:5002
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:5003
    depends_on:
      - parser-service
      - analytics-service
      - recommendation-service

  parser-service:
    build:
      context: ./services/parser-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  analytics-service:
    build:
      context: ./services/analytics-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002

  recommendation-service:
    build:
      context: ./services/recommendation-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
